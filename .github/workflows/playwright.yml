name: Playwright Tests
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        USERNAME_MAIN_USER: ${{ secrets.USERNAME_MAIN_USER }}
        PASSWORD_MAIN_USER: ${{ secrets.PASSWORD_MAIN_USER }}
        EMAIL_MAIN_USER: ${{ secrets.EMAIL_MAIN_USER }}
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Setup Pages
      if: ${{ !cancelled() }}
      uses: actions/configure-pages@v4
    - name: Upload Pages Artifact
      if: ${{ !cancelled() }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: playwright-report/
    - name: Deploy to GitHub Pages
      id: deployment
      if: ${{ !cancelled() }}
      uses: actions/deploy-pages@v4
    - name: Write Summary
      if: ${{ !cancelled() }}
      run: |
        echo "### 📊 Playwright Test Report" >> $GITHUB_STEP_SUMMARY
        echo "Tests completed. Link to the interactive HTML report:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 **[Open Playwright Report](${{ steps.deployment.outputs.page_url }})**" >> $GITHUB_STEP_SUMMARY