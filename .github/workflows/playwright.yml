name: Playwright Tests
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Run Playwright tests
      run: npx playwright test
      env:
        USERNAME_MAIN_USER: ${{ secrets.USERNAME_MAIN_USER }}
        PASSWORD_MAIN_USER: ${{ secrets.PASSWORD_MAIN_USER }}
        EMAIL_MAIN_USER: ${{ secrets.EMAIL_MAIN_USER }}
    - name: Generate Allure Report
      if: ${{ !cancelled() }}
      run: |
        npx allure generate allure-results --clean -o allure-report
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
    - name: Setup Pages
      if: ${{ !cancelled() }}
      uses: actions/configure-pages@v4
    - name: Upload Pages Artifact
      if: ${{ !cancelled() }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report/
    - name: Deploy to GitHub Pages
      id: deployment
      if: ${{ !cancelled() }}
      uses: actions/deploy-pages@v4
    - name: Write Summary
      if: ${{ !cancelled() }}
      run: |
        echo "### 📊 Allure Test Report" >> $GITHUB_STEP_SUMMARY
        echo "Tests completed. Link to the interactive Allure report:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 **[Open Allure Report](${{ steps.deployment.outputs.page_url }})**" >> $GITHUB_STEP_SUMMARY